<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <radialGradient id="bgrad" cx="50%" cy="50%" r="80%">
      <stop offset="0" stop-color="#15100B"/><stop offset="1" stop-color="#0E0B08"/>
    </radialGradient>
    <radialGradient id="glow" cx="78%" cy="10%" r="40%">
      <stop offset="0" stop-color="#C96E3F" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C96E3F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldglow" cx="14%" cy="92%" r="38%">
      <stop offset="0" stop-color="#E8B04B" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E8B04B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="36%" cy="27%" r="82%">
      <stop offset="0" stop-color="#E8B04B"/><stop offset="1" stop-color="#C96E3F"/>
    </radialGradient>
    <pattern id="grain" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#E7DAC8" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="2560" height="1440" fill="url(#bgrad)"/>
  <rect width="2560" height="1440" fill="url(#glow)"/>
  <rect width="2560" height="1440" fill="url(#goldglow)"/>
  <rect width="2560" height="1440" fill="url(#grain)"/>

  <line x1="0" y1="820" x2="2560" y2="820" stroke="#E7DAC8" stroke-opacity="0.07" stroke-width="1"/>

  <g transform="translate(740, 600)">
    <g transform="scale(3.75)">
      <circle cx="32" cy="32" r="22" fill="url(#disc)"/>
      <ellipse cx="24" cy="22" rx="13" ry="8.5" fill="#ffffff" opacity="0.13"/>
      <circle cx="32" cy="32" r="16.5" fill="none" stroke="#2a1604" stroke-opacity="0.22" stroke-width="1.3"/>
      <circle cx="32" cy="32" r="12"   fill="none" stroke="#2a1604" stroke-opacity="0.22" stroke-width="1.3"/>
      <circle cx="32" cy="32" r="6"    fill="#2A1604"/>
      <circle cx="32" cy="32" r="1.7"  fill="#0E0B08"/>
    </g>
    <text x="290" y="138" font-family="'Fraunces', Georgia, serif" font-weight="600" font-size="92" fill="#F4E8D6" letter-spacing="-1">Harmattan<tspan fill="#E8B04B" dx="4">·</tspan><tspan dx="4">Sessions</tspan></text>
    <text x="290" y="195" font-family="'DM Sans', Arial, sans-serif" font-weight="400" font-size="30" fill="#E7DAC8" opacity="0.72" font-style="italic">the sound of African evenings — from Accra.</text>
  </g>

  <text x="2440" y="1380" font-family="'DM Sans', Arial, sans-serif" font-weight="500" font-size="22" fill="#E7DAC8" opacity="0.4" text-anchor="end">Accra · Ghana</text>
</svg>

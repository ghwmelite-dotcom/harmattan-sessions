<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Dusk sky gradient: deep indigo top → terracotta → gold at horizon → dark below -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0612"/>
      <stop offset="0.28" stop-color="#1F100D"/>
      <stop offset="0.50" stop-color="#5A2818"/>
      <stop offset="0.66" stop-color="#A0451F"/>
      <stop offset="0.76" stop-color="#E8B04B"/>
      <stop offset="0.795" stop-color="#F4D38A"/>
      <stop offset="0.80" stop-color="#2A1808"/>
      <stop offset="1" stop-color="#0E0B08"/>
    </linearGradient>
    <!-- Warm halo around the sun -->
    <radialGradient id="sunglow" cx="0.62" cy="0.79" r="0.45">
      <stop offset="0" stop-color="#E8B04B" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#C96E3F" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Sun disc -->
    <radialGradient id="sundisc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE8B0"/>
      <stop offset="0.6" stop-color="#E8B04B"/>
      <stop offset="1" stop-color="#C96E3F"/>
    </radialGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A1808"/>
      <stop offset="1" stop-color="#0E0B08"/>
    </linearGradient>
    <pattern id="grain" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#E7DAC8" opacity="0.07"/>
    </pattern>
    <pattern id="haze" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.3" fill="#E8B04B" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Sun warm halo (large radial glow) -->
  <rect width="1920" height="1080" fill="url(#sunglow)"/>

  <!-- Sun (half-set behind horizon) -->
  <circle cx="1180" cy="845" r="78" fill="url(#sundisc)" opacity="0.95"/>

  <!-- Horizon line (thin bright band) -->
  <rect x="0" y="836" width="1920" height="5" fill="#FFE8B0" opacity="0.45"/>

  <!-- Ocean -->
  <rect x="0" y="841" width="1920" height="100" fill="url(#ocean)"/>

  <!-- Sun reflection shimmering rows -->
  <g opacity="0.65">
    <ellipse cx="1180" cy="852" rx="95" ry="2" fill="#FFE8B0"/>
    <ellipse cx="1180" cy="864" rx="75" ry="1.8" fill="#E8B04B" opacity="0.7"/>
    <ellipse cx="1180" cy="876" rx="55" ry="1.5" fill="#E8B04B" opacity="0.55"/>
    <ellipse cx="1180" cy="888" rx="40" ry="1.2" fill="#C96E3F" opacity="0.45"/>
    <ellipse cx="1180" cy="900" rx="28" ry="1" fill="#C96E3F" opacity="0.35"/>
    <ellipse cx="1180" cy="912" rx="20" ry="0.8" fill="#A0451F" opacity="0.3"/>
  </g>

  <!-- Distant Accra coastline lights along horizon -->
  <g fill="#FFE8B0" opacity="0.5">
    <circle cx="80" cy="836" r="0.7"/><circle cx="135" cy="838" r="0.5"/>
    <circle cx="195" cy="836" r="0.6"/><circle cx="248" cy="838" r="0.5"/>
    <circle cx="305" cy="836" r="0.7"/><circle cx="362" cy="838" r="0.5"/>
    <circle cx="418" cy="836" r="0.6"/><circle cx="475" cy="838" r="0.7"/>
    <circle cx="530" cy="836" r="0.5"/><circle cx="585" cy="838" r="0.6"/>
    <circle cx="642" cy="836" r="0.5"/><circle cx="700" cy="838" r="0.7"/>
    <circle cx="758" cy="836" r="0.5"/><circle cx="815" cy="838" r="0.6"/>
    <circle cx="872" cy="836" r="0.7"/><circle cx="930" cy="838" r="0.5"/>
    <circle cx="987" cy="836" r="0.6"/><circle cx="1045" cy="838" r="0.5"/>
    <circle cx="1095" cy="836" r="0.4"/>
    <circle cx="1275" cy="836" r="0.5"/><circle cx="1332" cy="838" r="0.7"/>
    <circle cx="1390" cy="836" r="0.5"/><circle cx="1448" cy="838" r="0.6"/>
    <circle cx="1505" cy="836" r="0.5"/><circle cx="1562" cy="838" r="0.7"/>
    <circle cx="1620" cy="836" r="0.5"/><circle cx="1678" cy="838" r="0.6"/>
    <circle cx="1735" cy="836" r="0.5"/><circle cx="1792" cy="838" r="0.7"/>
    <circle cx="1850" cy="836" r="0.5"/>
  </g>

  <!-- Harmattan haze low-band overlay -->
  <rect x="0" y="700" width="1920" height="180" fill="#E8B04B" opacity="0.05"/>

  <!-- Foreground silhouette: rooftop deck + palms -->
  <g fill="#000000">
    <!-- Rooftop deck slab -->
    <rect x="0" y="965" width="1920" height="115"/>
    <rect x="0" y="945" width="1920" height="22"/>
    <!-- Hint of railing dots -->
    <g opacity="0.8">
      <circle cx="80" cy="950" r="3"/><circle cx="200" cy="950" r="3"/>
      <circle cx="320" cy="950" r="3"/><circle cx="440" cy="950" r="3"/>
      <circle cx="560" cy="950" r="3"/><circle cx="680" cy="950" r="3"/>
      <circle cx="800" cy="950" r="3"/><circle cx="920" cy="950" r="3"/>
      <circle cx="1040" cy="950" r="3"/><circle cx="1160" cy="950" r="3"/>
      <circle cx="1280" cy="950" r="3"/><circle cx="1400" cy="950" r="3"/>
      <circle cx="1520" cy="950" r="3"/><circle cx="1640" cy="950" r="3"/>
      <circle cx="1760" cy="950" r="3"/><circle cx="1880" cy="950" r="3"/>
    </g>

    <!-- Palm 1 — left, large -->
    <g transform="translate(260, 945)">
      <path d="M -6 0 C -10 -160, -16 -320, -10 -500 L 0 -505 C 6 -320, 14 -160, 6 0 Z"/>
      <g transform="translate(-2, -505)">
        <path d="M 0 0 C -50 -25, -110 -10, -150 35 C -110 0, -55 12, 0 0 Z"/>
        <path d="M 0 0 C 50 -25, 110 -10, 150 35 C 110 0, 55 12, 0 0 Z"/>
        <path d="M 0 0 C -55 -38, -110 -65, -130 -100 C -90 -65, -40 -28, 0 0 Z"/>
        <path d="M 0 0 C 55 -38, 110 -65, 130 -100 C 90 -65, 40 -28, 0 0 Z"/>
        <path d="M 0 0 C -12 -38, -28 -90, -10 -135 C -6 -85, -3 -35, 0 0 Z"/>
        <path d="M 0 0 C 12 -38, 28 -90, 10 -135 C 6 -85, 3 -35, 0 0 Z"/>
        <path d="M 0 0 C -28 5, -80 35, -105 70 C -75 35, -28 12, 0 0 Z"/>
        <path d="M 0 0 C 28 5, 80 35, 105 70 C 75 35, 28 12, 0 0 Z"/>
      </g>
    </g>

    <!-- Palm 2 — right, slightly smaller -->
    <g transform="translate(1720, 945)">
      <path d="M -5 0 C -8 -140, -12 -270, -8 -430 L 0 -435 C 5 -270, 11 -140, 5 0 Z"/>
      <g transform="translate(-2, -435)">
        <path d="M 0 0 C -42 -22, -95 -10, -130 30 C -95 -2, -48 10, 0 0 Z"/>
        <path d="M 0 0 C 42 -22, 95 -10, 130 30 C 95 -2, 48 10, 0 0 Z"/>
        <path d="M 0 0 C -45 -32, -95 -55, -115 -88 C -80 -55, -38 -25, 0 0 Z"/>
        <path d="M 0 0 C 45 -32, 95 -55, 115 -88 C 80 -55, 38 -25, 0 0 Z"/>
        <path d="M 0 0 C -10 -32, -22 -80, -8 -120 C -4 -75, -2 -30, 0 0 Z"/>
        <path d="M 0 0 C 10 -32, 22 -80, 8 -120 C 4 -75, 2 -30, 0 0 Z"/>
        <path d="M 0 0 C -22 5, -68 30, -90 60 C -62 30, -22 10, 0 0 Z"/>
        <path d="M 0 0 C 22 5, 68 30, 90 60 C 62 30, 22 10, 0 0 Z"/>
      </g>
    </g>
  </g>

  <!-- Soft dust particles / grain overlay -->
  <rect width="1920" height="1080" fill="url(#grain)"/>
  <!-- Subtle warm haze near horizon -->
  <rect x="0" y="720" width="1920" height="200" fill="url(#haze)"/>
</svg>

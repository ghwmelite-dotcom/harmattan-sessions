name: Deploy to Cloudflare (Workers Static Assets)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Skip deploy gracefully if secrets aren't configured yet (e.g. first merge after setup).
      - name: Check Cloudflare secrets
        id: cf
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID secrets not set — skipping deploy. Add them in repo Settings → Secrets and variables → Actions."
          fi

      # `wrangler deploy` (Workers + Static Assets) — uses adapter-generated dist/server/wrangler.json
      # via the .wrangler/deploy/config.json hint created during `npm run build`.
      - name: Deploy
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: npm
